name: Publish socio4health to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # socio4health-core: code + basic dependencies (+ extras scraping/ml/geo/all)
      - name: Build socio4health-core
        run: python -m build --outdir dist/

      # socio4health: meta-package that depends on socio4health-core[all]
      # (--sdist --wheel builds both from the source folder so it can read the version from src/)
      - name: Build socio4health (full meta-package)
        run: python -m build meta --sdist --wheel --outdir dist/

      - name: Publish to PyPI
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
